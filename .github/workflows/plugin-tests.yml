name: plugin-tests

# Guard hooks fail OPEN when broken — this is the only automated line of
# defense before a regression ships. Runs the hook regression suite and
# syntax-checks every hook script on each push/PR.
# (scripts/check-plugin.sh needs the local ZCode binary and stays manual.)
on:
  push:
    paths: ['plugins/aidlc/**', 'scripts/**']
  pull_request:
    paths: ['plugins/aidlc/**', 'scripts/**']

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check all hook scripts
        run: |
          fail=0
          for f in $(find plugins/aidlc/hooks/scripts -name '*.mjs'); do
            node --check "$f" && echo "ok  $f" || { echo "FAIL $f"; fail=1; }
          done
          exit $fail
      - name: Guard regression suite
        run: node scripts/tests/guard-gates.test.mjs
